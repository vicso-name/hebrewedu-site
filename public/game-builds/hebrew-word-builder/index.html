<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, follow" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#6b4a6e" />
    <title>Hebrew Word Builder</title>
    <style>:root{--boot-bg:#f6c08a;--boot-sky-top:#6b4a6e;--boot-sky-mid:#e07a5f;--boot-text:#3a2414;--boot-text-muted:#6b5039;--boot-surface:#fbf3e4;--boot-sunken:#f1e3c8;--boot-disabled:#ddd0bc;--boot-accent:#d9692b;--boot-accent-text:#2a1608;--boot-tile:#ebcb98;--boot-tile-edge:#a87a42;--boot-scrim:#2a16088c}html,body,#game-root{background:var(--boot-bg);width:100%;height:100%;margin:0;overflow:hidden}html,body{overscroll-behavior:none;touch-action:manipulation}body{color:var(--boot-text);font-family:Rubik,Arial,Helvetica,sans-serif}canvas{display:block}#boot-loader{z-index:10;box-sizing:border-box;background:linear-gradient(var(--boot-sky-top) 0%, var(--boot-sky-mid) 52%, var(--boot-bg) 80%, var(--boot-bg) 100%);opacity:1;flex-direction:column;align-items:center;padding:24vh 24px 0;transition:opacity .25s;display:flex;position:fixed;inset:0}#boot-loader[data-state=ready]{opacity:0;pointer-events:none}#boot-progress,#boot-error{box-sizing:border-box;background:var(--boot-surface);text-align:center;border-radius:16px;flex-direction:column;gap:14px;width:100%;max-width:320px;padding:24px;display:flex;box-shadow:0 6px 20px #2a160838}@media (min-width:1000px){#boot-loader{padding-top:20vh}#boot-progress,#boot-error{max-width:440px}.boot-title{font-size:36px;line-height:42px}}.boot-tiles{direction:rtl;justify-content:center;gap:8px;display:flex}.boot-tile{box-sizing:border-box;border:1px solid var(--boot-tile-edge);background:var(--boot-tile);width:44px;height:44px;box-shadow:0 4px 0 var(--boot-tile-edge);color:var(--boot-text);border-radius:12px;place-items:center;font:600 26px/1 Rubik,Arial,sans-serif;display:grid}.boot-title{color:var(--boot-text);margin:0;font:700 28px/34px Rubik,Arial,Helvetica,sans-serif}.boot-track{background:var(--boot-sunken);border-radius:4px;height:8px;overflow:hidden}.boot-track i{background:var(--boot-accent);border-radius:4px;width:40%;height:100%;animation:1.4s ease-in-out infinite boot-track;display:block}@keyframes boot-track{0%{transform:translate(-100%)}to{transform:translate(250%)}}.boot-caption{color:var(--boot-text-muted);margin:0;font:500 13px/18px Rubik,Arial,Helvetica,sans-serif}#boot-error{align-items:center;display:none}#boot-error p{color:var(--boot-text);margin:0}#boot-retry{background:var(--boot-accent);min-height:48px;color:var(--boot-accent-text);cursor:pointer;border:none;border-radius:12px;padding:0 24px;font:600 16px Rubik,Arial,Helvetica,sans-serif}#boot-loader[data-state=error] #boot-progress{display:none}#boot-loader[data-state=error] #boot-error{display:flex}@media (prefers-reduced-motion:reduce){.boot-track i{width:100%;animation:none}}</style>
    <script type="module" crossorigin src="./assets/index-Ci6ZzrfH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DwaJPAXL.css">
  </head>
  <body>
    <main id="game-root" aria-label="HebrewEdu learning game"></main>
    <div id="boot-loader" role="status" aria-live="polite" data-state="loading">
      <div id="boot-progress">
        <div class="boot-tiles" lang="he" dir="rtl" aria-hidden="true">
          <span class="boot-tile">ב</span>
          <span class="boot-tile">נ</span>
          <span class="boot-tile">ה</span>
        </div>
        <p class="boot-title">Hebrew Word Builder</p>
        <div class="boot-track" aria-hidden="true"><i></i></div>
        <p class="boot-caption">Loading words and audio</p>
      </div>
      <div id="boot-error">
        <p>Couldn't load the game</p>
        <button id="boot-retry" type="button">Try again</button>
      </div>
    </div>
  </body>
</html>
